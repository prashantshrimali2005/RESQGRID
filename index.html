  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport" />
  <title>RESQGRID — Disaster Response Ecosystem</title>
  <meta name="description" content="RESQGRID connects citizens with disaster-response authorities, volunteers, shelters, and relief resources." />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />

  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>

            'surface-container-lowest': '#ffffff', 'primary-fixed': '#dce1ff',
            'surface-tint': '#2151da', 'on-surface-variant': '#434655',
            'on-tertiary-fixed-variant': '#005320', 'secondary-fixed-dim': '#bec6e0',
            'on-primary-container': '#cad3ff', 'on-primary': '#ffffff',
            'on-secondary-container': '#5c647a', 'inverse-surface': '#213145',
            'surface-variant': '#d3e4fe', 'on-tertiary-fixed': '#002109',
            'error-container': '#ffdad6', 'tertiary': '#00501f', 'on-secondary': '#ffffff',
            'surface-dim': '#cbdbf5', 'surface-container': '#e5eeff',

            'on-tertiary-container': '#71ee8a', 'on-primary-fixed': '#001551',
            'on-secondary-fixed-variant': '#3f465c',

            // Emergency Colors

            'high': '#ea580c', // Orange 600
            'warning': '#ca8a04', // Yellow 600
            'safe': '#16a34a', // Green 600
            'info': '#2563eb', // Blue 600

            'surface-inverted': '#0f172a',
            
            'text-primary': '#0f172a',
            'text-secondary': '#475569',
            'text-muted': '#94a3b8',
            'text-inverted': '#f8fafc',
            
            'border-light': '#e2e8f0',
            'border-base': '#cbd5e1',
          },
          fontFamily: {

            'display-md': '400',
            'display-sm': '400',

            'headline-sm': '400',

            'title-sm': '500',

  </script>
  <style>
    @layer base {
      html, body { 
        width: 100vw; 
        margin: 0; 
        padding: 0; 
        min-height: 100%; 
        background-color: #f8fafc;
        color: #0f172a;
        font-family: 'Inter', sans-serif;
      }
      body { 
        overscroll-behavior-y: none; 
        -webkit-tap-highlight-color: transparent; 
      }
      
      /* Hide scrollbar for clean UI */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="antialiased flex flex-col min-h-screen">
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
